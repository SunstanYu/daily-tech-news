rss_defaults:
  window_hours: 48
  max_items: 30
rss_sources:
- name: OpenAI
  type: rss
  url: https://openai.com/news/rss.xml
  enabled: true
- name: Google Research
  type: rss
  url: https://research.google/blog/rss
  enabled: true
- name: DeepMind
  type: rss
  url: https://deepmind.google/blog/feed
  enabled: true
- name: TLDR AI
  type: rss
  url: https://tldr.tech/api/rss/ai
  enabled: true
- name: Hugging Face
  type: rss
  url: https://huggingface.co/blog/feed.xml
  enabled: true
- name: Hacker News
  type: algolia
  query: ai OR agent
  points_threshold: 50
  max_items: 30
  enabled: true
following_stream:
  enabled: true
  handles:
  - latepostnews
  - ai_xiaomu
  - dashen_wang
  - LangChain
  - AnthropicAI
  - karpathy
  - snail_9106
  - Stanleysobest
  - yidabuilds
  - wangray
  - Khazix0918
  - li9292
  - oran_ge
  - yucheng
  - TJ_Research
  - LawrenceW_Zen
  - Franktradinglog
  window_hours: 24
  lang: null
  exclude_retweets: false
  exclude_replies: false
  max_pages: 20
keywords_stream:
  enabled: false
  keywords:
  - ai
  - agent
  min_faves: 300
  window_hours: 24
  lang: en
  top_n: 20
  unique_authors_weight: 2.0
  engagement_weight: 1.0
  engagement_norm_base: 1000
twitterapi:
  token_env: TWITTERAPI_KEY
  timeout_seconds: 30
storage:
  db_path: ./data/news.db
  dedup_window_days: 7
output:
  digest_dir: ./digests
  raw_filename: digest_raw.json
summarize:
  fetch_fulltext: true
  generate_angle: true
  max_concurrent: 3
